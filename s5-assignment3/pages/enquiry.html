<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>معهد Coderz - الاستفسار</title>
</head>
<body>

   
    <nav>
        <ul>
            <li><a href="../index.html">الرئيسية</a></li>
            <li><a href="schedule.html">المواعيد</a></li>
        
        </ul>
    </nav>

    <main>
        <h1>صفحة الاستفسار</h1>
        <p>يسعدنا الإجابة عن كافة استفساراتكم حول التسجيل في كورسات المعهد.</p>
    </main>

<ul>
        
           <li> <label for="fullName">الاسم الكامل:</label>
            <input type="text" id="fullName" name="fullName" placeholder="أدخل اسمك الكامل هنا" autocomplete="name"></li>
       
           <li> <label for="email">البريد الإلكتروني:</label>
            <input type="email" id="email" name="email" placeholder="example@domain.com"></li>

           <li> <label for="phone">رقم الهاتف:</label>
            <input type="tel" id="phone" name="phone" placeholder="+962xxxxxxxxxx">

       <li><label for="course">اختر كورسًا:</label>
            <select id="course" name="course">
                <option value="HTML Forms">HTML Forms</option>
                <option value="HTML Content">HTML Content</option>
            </select></li>

<li><label for="seats">عدد المقاعد المفضلة:</label>
            <input type="number" id="seats" name="seats" value="1" min="1"></li>

<li><label for="preferredDate">التاريخ المفضّل:</label>
            <input type="date" id="preferredDate" name="preferredDate"></li>

<li>
       <label for="inquiryText">نص الاستفسار:</label>
            <textarea id="inquiryText" name="inquiryText" placeholder="اكتب رسالتك هنا..."></textarea>
</li>

  <button type="submit">إرسال الاستفسار</button>




        </body>
</html>
